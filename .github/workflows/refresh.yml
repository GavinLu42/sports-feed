name: Refresh calendar

on:
  # Runs when the biweekly Claude sweep pushes sweep.txt (or the team list changes).
  push:
    paths: ["sweep.txt", "teams.json", "extra_games.json", "build_feed.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python3 build_feed.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.ics games.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh games $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
